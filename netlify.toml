[build]
  command = "npm ci && npm --prefix netlify/functions ci --omit=dev && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "pdf-parse", "@napi-rs/canvas"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ephemeral-token"
  to = "/.netlify/functions/api/ephemeral-token"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
