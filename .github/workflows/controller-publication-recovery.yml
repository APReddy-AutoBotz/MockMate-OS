name: Controller Publication Recovery

on:
  push:
    branches:
      - codex/p0-8-hosted-preview-acceptance

permissions:
  contents: write

jobs:
  publish-approved-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified P0-8 recovery and remove scaffold
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='8bdfff86e5d7280680a1a91bdc88a7e52b368a87'
          COMMENT_ID='5310184379'
          WORKFLOW='.github/workflows/controller-publication-recovery.yml'

          test "$(git rev-parse HEAD^)" = "$BASE"
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body > /tmp/recovery-comment.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          body = Path('/tmp/recovery-comment.txt').read_text()
          chunks = re.findall(r'\*\*Chunk \d+/5\*\*\s*```text\s*([A-Za-z0-9+/=\r\n]+?)\s*```', body)
          assert len(chunks) == 5, len(chunks)
          payload = ''.join(''.join(chunk.split()) for chunk in chunks)
          assert len(payload) == 7832, len(payload)
          Path('/tmp/recovery.b64').write_text(payload)
          PY
          base64 -d /tmp/recovery.b64 > /tmp/recovery.patch.gz
          echo '606579763ca2c82cd998abea0653b6c4d5712a24c7bbf1ed56e64d6b2dbd3b33  /tmp/recovery.patch.gz' | sha256sum -c -
          test "$(wc -c < /tmp/recovery.patch.gz | tr -d ' ')" = '5874'
          gzip -dc /tmp/recovery.patch.gz > /tmp/recovery.patch
          echo '5330eab61f1a462c5a35c32764f6a5d4d05ffb7ed19b134ebf1b31d7490ab438  /tmp/recovery.patch' | sha256sum -c -
          test "$(wc -c < /tmp/recovery.patch | tr -d ' ')" = '26669'

          git apply --check /tmp/recovery.patch
          git apply /tmp/recovery.patch
          test "$(git hash-object config/hosted-acceptance-scenarios.example.json)" = '2f7347a4ad0697090c5d0cd34d71ed6340af2393'
          test "$(git hash-object docs/quality/p0-8-hosted-preview-evidence.md)" = '2f3d82900904592dd4a4d27438e50f68e3205af8'
          test "$(git hash-object scripts/hosted-preview-acceptance.mjs)" = '24c9203b00d31af4a0a2f531d8960f631590c2a8'
          test "$(git hash-object scripts/test-hosted-acceptance-guard.mjs)" = 'ed171e0cb5fafa2009fd49b46b996e2be7aa2ec3'

          git rm "$WORKFLOW"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(hosted): converge P0-8 acceptance truth'
          git push origin HEAD:codex/p0-8-hosted-preview-acceptance
