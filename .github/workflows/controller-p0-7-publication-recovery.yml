name: Controller P0-7 Publication Recovery

on:
  push:
    branches: [codex/p0-7-mobile-career-context-account-authority]

permissions:
  contents: write

jobs:
  publish-approved-correction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/p0-7-mobile-career-context-account-authority

      - name: Recover and apply approved PR-comment diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/APReddy-AutoBotz/MockMate-OS/issues/comments/5305439448 --jq .body > /tmp/comment.txt
          python - <<'PY'
          body = open('/tmp/comment.txt', encoding='utf-8').read()
          marker = '```diff\n'
          start = body.index(marker) + len(marker)
          end = body.index('\n```', start)
          patch = body[start:end]
          open('/tmp/recovery.diff', 'w', encoding='utf-8', newline='').write(patch)
          print('recovered', len(patch.encode('utf-8')), 'bytes')
          PY
          git apply --check /tmp/recovery.diff
          git apply --index /tmp/recovery.diff
          rm .github/workflows/controller-p0-7-publication-recovery.yml
          git add -A
          git diff --cached --check

      - name: Validate exact correction
        run: |
          npm ci
          npm run shared:build
          npm run build --workspace=mockmate-backend
          npm test --workspace=mockmate-backend -- --runInBand --runTestsByPath tests/accentCareerContextAdapter.test.ts
          npm run test:career-context-api-journey
          npm run test:mobile-governed-parity

      - name: Publish to existing PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(career-context): converge replay and rebuild authority'
          git push origin HEAD:codex/p0-7-mobile-career-context-account-authority
