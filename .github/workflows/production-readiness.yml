name: MockMate Production Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, netlify-preview]

permissions:
  contents: read

concurrency:
  group: mockmate-production-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-and-api-build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 1. Install root & workspace dependencies
        run: npm ci

      - name: 2. Shared typecheck
        run: npm run check:contracts

      - name: 3. Shared tests
        run: npm run shared:test

      - name: 4. Shared build
        run: npm run shared:build

      - name: 4a. Shared CommonJS runtime load
        run: npm run test:shared-runtime-load

      - name: 5. Frontend typecheck
        run: npm run typecheck

      - name: 6. Frontend unit tests
        run: npm test -- --runInBand

      - name: 7. Full static migration verification
        run: npm run verify:supabase

      - name: 8. Disposable PostgreSQL runtime migration verification
        run: npm run verify:supabase:runtime
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: 8a. ClearSpeak P0-5 real-speech persistence contract
        run: npm run test:clearspeak-p0-5-db
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: 9. Frontend build
        run: npm run build

      - name: 10. Backend build
        run: cd backend && npm run build

      - name: 11a. Static runtime configuration precheck
        run: npm run test:runtime-config-static

      - name: 11f. Production mock-auth rejection test
        run: npm run test:production-auth-rejection

      - name: 11b. Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 11c. Playwright browser runtime execution test
        run: npm run test:browser-runtime

      - name: 11d. Adaptive API Integration Journey
        run: npm run test:adaptive-api-journey

      - name: 11e. Adaptive Browser UI Journey
        run: npm run test:adaptive-ui-journey

      - name: 11g0. Architectural rejection assertions
        run: npm run test:rejection-checks

      - name: 11g1. Career Context API integration journey
        run: npm run test:career-context-api-journey

      - name: 11g2. Resume to Interview grounding journey
        run: npm run test:resume-interview-journey

      - name: 11g3. ClearSpeak to Interview grounding journey
        run: npm run test:clearspeak-interview-journey

      - name: 11g4. Resume to ClearSpeak grounding journey
        run: npm run test:resume-clearspeak-journey

      - name: 11g5. Career Context account deletion CI journey
        run: npm run test:career-context-account-deletion

      - name: 11g6. Career Context overall grounding suite
        run: npm run test:career-context-journeys

      - name: 12. Backend tests
        run: cd backend && npm test

      - name: 12a. ClearSpeak V1 contract and synthetic scorer gate
        run: npm run check:clearspeak-v1

      - name: 13. Production smoke checks
        run: npm run smoke:production

      - name: 13. Dependency audit
        run: npm run audit:production

      - name: 14. Install mobile dependencies
        run: cd mobile && npm ci

      - name: 15. Mobile typecheck
        run: npm run mobile:typecheck

      - name: 16. Mobile lint
        run: npm run mobile:lint

      - name: 16a. Mobile governed core parity guard
        run: npm run test:mobile-governed-parity

      - name: 16b. P0-8 hosted acceptance fail-closed contract
        run: npm run test:hosted-acceptance-contract

      - name: 20. Recognized full-history secret scan
        run: npx --yes gitleaks@8.24.3 git --redact --no-banner

      - name: 21. Supplemental custom secret-pattern scan
        run: npm run scan:secrets

      - name: 22. Production config smoke check
        run: npm run smoke:production

      - name: 23. Production-preview adversarial security checks
        run: npm run test:preview-security

      - name: 23a. Cross-surface runtime-mode authority
        run: npm run test:runtime-mode-authority

      - name: 24. Target-agnostic disposable smoke contract
        run: npm run smoke:deployed

      - name: 25. Exact-head readiness manifest
        run: npm run manifest:readiness

      - name: 26. Publish source-only readiness evidence
        run: |
          mkdir -p artifacts
          cat > artifacts/source-readiness.txt <<EOF
          head=${GITHUB_SHA}
          workflow=${GITHUB_RUN_ID}
          result=source-only
          EOF

      - name: Upload source readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: source-readiness-${{ github.sha }}
          path: artifacts/source-readiness.txt
